name: Build NEXORA Signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/NEXORA-Deploy-v1.3.0.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract NEXORA source
        run: |
          mkdir -p project
          unzip -q .github/NEXORA-Deploy-v1.3.0.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo 'Missing KEYSTORE_BASE64 GitHub Secret' && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > project/app/nexora-release.jks

      - name: Build signed release APK
        working-directory: project
        env:
          NEXORA_KEYSTORE_FILE: app/nexora-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-release-signed
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
