name: Build NEXORA Signed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/NEXORA-v1.2.1-FixedSigning.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract NEXORA project
        run: |
          mkdir -p project
          unzip -q .github/NEXORA-v1.2.1-FixedSigning.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Restore fixed release signing key
        env:
          NEXORA_KEYSTORE_BASE64: ${{ secrets.NEXORA_KEYSTORE_BASE64 }}
          NEXORA_STORE_PASSWORD: ${{ secrets.NEXORA_STORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        run: |
          test -n "$NEXORA_KEYSTORE_BASE64" || { echo "Missing NEXORA_KEYSTORE_BASE64"; exit 1; }
          test -n "$NEXORA_STORE_PASSWORD" || { echo "Missing NEXORA_STORE_PASSWORD"; exit 1; }
          test -n "$NEXORA_KEY_ALIAS" || { echo "Missing NEXORA_KEY_ALIAS"; exit 1; }
          test -n "$NEXORA_KEY_PASSWORD" || { echo "Missing NEXORA_KEY_PASSWORD"; exit 1; }
          echo "$NEXORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-release.jks"
          echo "NEXORA_KEYSTORE_FILE=$RUNNER_TEMP/nexora-release.jks" >> "$GITHUB_ENV"
          echo "NEXORA_STORE_PASSWORD=$NEXORA_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXORA_KEY_ALIAS=$NEXORA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXORA_KEY_PASSWORD=$NEXORA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        run: gradle -p project :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK=project/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-release-signed-APK
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
